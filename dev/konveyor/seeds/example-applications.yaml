# Development inventory only: a YAML list of individual Hub application bodies.
# Select one item, convert that item to JSON, and use it as POST /hub/applications
# only when an explicit Hub write is desired. This file does not perform writes.
# No IDs, credentials, tags, analysis profiles, tasks, findings, or states are seeded.
# Checked: 2026-10-28 via GitHub repository metadata, branch, and contents APIs.
# Repository: https://github.com/konveyor/example-applications
# Default branch: main
# Observed main commit: 41f4e20bbf71fe318b11b173787aa87ba6281aec
# Keep branch as main: the addon git pull workflow requires a named branch,
# not a detached commit checkout. The observed commit is provenance, not a pin.
# Metadata: https://api.github.com/repos/konveyor/example-applications
# Ref: https://api.github.com/repos/konveyor/example-applications/branches/main
# Root inventory: https://api.github.com/repos/konveyor/example-applications/contents/?ref=41f4e20bbf71fe318b11b173787aa87ba6281aec
# Exactly five root directories exist at that ref; each is retained below.
# Paths are relative to the repository root, not separate Git repositories.
# Analysis compatibility/results have not been exercised; select an appropriate
# installed analyzer/profile separately. These payloads only register inventory.

# Source: https://github.com/konveyor/example-applications/tree/41f4e20bbf71fe318b11b173787aa87ba6281aec/book-server
# pom.xml declares Spring Boot 2.1.0.RELEASE; README only gives the project name.
- name: book-server
  description: Spring Boot 2.1.0 BookServer Java sample from Konveyor example-applications.
  repository:
    kind: git
    url: https://github.com/konveyor/example-applications.git
    branch: main
    path: book-server

# Source: https://github.com/konveyor/example-applications/tree/41f4e20bbf71fe318b11b173787aa87ba6281aec/daytrader
# Java EE 7 / WAS Liberty sample, not a Spring Boot application. The root POM
