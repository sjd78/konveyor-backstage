# Source: https://github.com/konveyor/example-applications/tree/41f4e20bbf71fe318b11b173787aa87ba6281aec/petclinic
# WARNING: This directory contains README.md ONLY, not application source or a
# pom.xml. Keep it as the fifth verified inventory entry, but do not expect Java
# analysis findings from this path. README points to source in a DIFFERENT repo:
# https://github.com/konveyor/spring-framework-petclinic/tree/legacy
# This inventory entry deliberately retains the docs-only folder. The separate
# petclinic-source.yaml companion verifies and selects the external legacy source.
# The walkthrough also describes custom rules/target setup; registering this
# body neither installs those rules nor recreates that analysis configuration.
- name: petclinic
  description: Documentation-only Petclinic walkthrough folder; application source is external, so this path is not a runnable Java analysis sample.
  repository:
    kind: git
    url: https://github.com/konveyor/example-applications.git
    branch: main
    path: petclinic

