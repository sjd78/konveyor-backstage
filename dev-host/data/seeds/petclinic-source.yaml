# The separate example-applications.yaml retains the original docs-only
# petclinic folder inventory without silently replacing its repository/path.
- name: petclinic-legacy-source
  description: Petclinic legacy Spring Framework WAR source with Spring Session and Hazelcast, from the external repository linked by the Konveyor walkthrough.
  repository:
    kind: git
    url: https://github.com/konveyor/spring-framework-petclinic.git
