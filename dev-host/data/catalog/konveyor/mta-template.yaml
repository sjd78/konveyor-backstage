apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: mta-register-application
  title: Register application for migration
  description: Register an application for migration from the catalog or a Git repository.
  tags:
    - migration
    - mta
    - modernization
spec:
  type: service
  parameters:
    - title: Application details
      description: >-
        Select an existing application from the catalog, or enter a repository
        URL to register a new one.
      required:
        - application
      properties:
        application:
          title: Application
          type: object
          required:
            - applicationSource
          ui:field: MtaApplicationSource
          # The field renders and announces its own errors. Hiding the native
          # copy under the field avoids the same sentence twice; rawErrors still
          # reach the field so its errors show after Review.
          ui:hideError: true
          properties:
            applicationSource:
              title: Application source
              type: string
              enum: [catalog, repository]
              enumNames: [Existing catalog application, Git repository]
            entityRef:
              title: Catalog application
              type: string
            repository:
              title: Repository
              type: string
              ui:widget: hidden
            repoUrl:
              title: Repository URL
              type: string
            rootPath:
              title: Application root path
              type: string
  steps:
    # One registration step for both paths. The action accepts exactly one of
    # entityRef or repoUrl, so the task page never lists a step that did not run.
    - id: register
      name: Register with MTA
      action: mta:register-application
      input:
        entityRef: ${{ parameters.application.entityRef }}
        repoUrl: ${{ parameters.application.repoUrl }}
        repository: ${{ parameters.application.repository }}
        rootPath: ${{ parameters.application.rootPath }}
  output:
    links:
      # The catalog path links the Component the member selected; the repository
      # path links the Component the entity provider creates after registration.
      - title: View migration status
        url: >-
          ${{ '/catalog/' + steps.register.output.entityNamespace + '/component/' + steps.register.output.entityName + '/migration' + ('?autoDiscover=true' if steps.register.output.autoDiscover else '') }}
    text:
      - title: Application registered
        content: |
          **${{ steps.register.output.applicationTitle }}** has been registered with MTA.

          Click **View migration status** to see discovered technologies and select a migration path.
